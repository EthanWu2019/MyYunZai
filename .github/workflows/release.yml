name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Windows MSI + NSIS
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      - name: Verify artifacts
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter '*.msi' -EA SilentlyContinue
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -EA SilentlyContinue
          if (-not $msi -or -not $nsis) { Write-Error "Missing Windows artifacts"; exit 1 }
          Write-Output "MSI: $($msi[0].FullName) ($($msi[0].Length) bytes)"
          Write-Output "NSIS: $($nsis[0].FullName) ($($nsis[0].Length) bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YunZaiConsole-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  # macOS Apple Silicon (M1/M2/M3/M4)
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (macOS aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Verify artifacts
        run: |
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/macos/
          ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/ 2>/dev/null || echo "no dmg"

      - name: Upload macOS aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YunZaiConsole-macos-aarch64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/YunZaiConsole.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  # macOS Intel
  build-macos-x86_64:
    runs-on: macos-13  # Intel runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (macOS x86_64)
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Verify artifacts
        run: |
          ls -la src-tauri/target/x86_64-apple-darwin/release/bundle/macos/
          ls -la src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/ 2>/dev/null || echo "no dmg"

      - name: Upload macOS x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YunZaiConsole-macos-x86_64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/YunZaiConsole.app
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # Upload to GitHub Release (after all builds complete)
  release:
    needs: [build-windows, build-macos-aarch64, build-macos-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -laR artifacts/

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          name: 'YunZaiConsole v${{ github.ref_name }}'
          body: |
            Tauri 2 desktop console for TRSS Yunzai + NapCat + Redis.

            **Features**: Single-instance + tray + close-to-tray, strict startup order
            (Redis -> Yunzai -> NapCat), keep Redis on close, embedded WebUI iframe,
            real-time log tail, settings panel.

            **Privacy**: No user data uploaded. Default paths use `<USERNAME>` placeholder.

            **Install**:
            - **Windows**: MSI (recommended) or NSIS exe
            - **macOS Intel**: `.dmg` or `.app` (drag to Applications)
            - **macOS Apple Silicon** (M1/M2/M3/M4): `.dmg` or `.app` (drag to Applications)

            **Note**: This app is a **launcher/console** for an existing Yunzai installation.
            It does NOT include Yunzai itself, NapCat, Redis, or QQ — those must be
            installed separately on each user's machine. The app reads paths from
            Settings panel on first run.
          draft: false
          prerelease: false
          files: |
            artifacts/YunZaiConsole-windows/*.msi
            artifacts/YunZaiConsole-windows/*.exe
            artifacts/YunZaiConsole-macos-aarch64/*.dmg
            artifacts/YunZaiConsole-macos-x86_64/*.dmg

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      - name: Verify artifacts
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter '*.msi' -EA SilentlyContinue
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -EA SilentlyContinue
          if (-not $msi -or -not $nsis) { Write-Error "Missing Windows artifacts"; exit 1 }
          Write-Output "MSI: $($msi[0].FullName) ($($msi[0].Length) bytes)"
          Write-Output "NSIS: $($nsis[0].FullName) ($($nsis[0].Length) bytes)"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YunZaiConsole-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'YunZaiConsole v${{ github.ref_name }}'
          body: |
            Tauri 2 desktop console for TRSS Yunzai + NapCat + Redis.

            **Major feature: First-Run Wizard (yunzai one-click deployment)**
            - Downloads Yunzai + NapCat + 23 plugins + npm deps (~1-3 GB)
            - Default install path: `C:\YunZaiApp\`
            - All 23 of owner's gaming laptop plugins pre-selected
            - Setup completes in 5-30 minutes depending on network

            **After setup completes**:
            - 4 status cards show Redis / Yunzai / NapCat / QQ
            - "Start All" launches in strict order (Redis -> Yunzai -> NapCat)
            - "Stop" keeps Redis running
            - WebUI tab embeds `http://localhost:6099/webui/` for QR scan

            **Privacy**: No user data uploaded. All config stays local at
            `%APPDATA%/com.ethanwu.yunzai/`.

            **Install**: MSI (recommended) or NSIS exe. Both are self-contained,
            ~5 MB. Setup downloads the rest on first launch.
          draft: false
          prerelease: false
          files: |
            artifacts/YunZaiConsole-windows/*.msi
            artifacts/YunZaiConsole-windows/*.exe

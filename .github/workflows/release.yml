name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo config (rust-lld workaround)
        run: |
          New-Item -ItemType Directory -Force -Path .cargo
          @'
          [target.x86_64-pc-windows-msvc]
          linker = "rust-lld.exe"
          rustflags = ["-C", "link-arg=/LIBPATH:C:\Program Files (x86)\Windows Kits\10\Lib\10.0.19041.0\um\x64", "-C", "link-arg=/LIBPATH:C:\Program Files (x86)\Windows Kits\10\Lib\10.0.19041.0\ucrt\x64"]
          [net]
          git-fetch-with-cli = true
          '@ | Out-File -Encoding UTF8 .cargo/config.toml

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      - name: List build artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' } |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: 'YunZaiConsole v${{ github.ref_name }}'
          body: |
            Tauri 2 desktop console for TRSS Yunzai + NapCat + Redis.

            **Features**:
            - Single-instance + tray icon + close-to-tray
            - Strict startup order: Redis -> Yunzai (nvm node) -> NapCat
            - Close order: kill Yunzai + NapCat, **keep Redis**
            - Embedded WebUI iframe for QR scan
            - Real-time log tail (yunzai/napcat logs)
            - Settings panel for paths + behavior

            **Privacy**: No user data uploaded. Default paths use `<USERNAME>` placeholder.

            **Install**:
            - **MSI** (recommended): install to Program Files
            - **NSIS exe**: portable installer

            **First run**:
            1. Start app
            2. Click "Settings" -> update paths to your real install locations
            3. Restart app
            4. Status cards should turn green if your bot is already running
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        env:
          # Disable code signing for unsigned release builds
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri build

      - name: Verify artifacts
        run: |
          $msi = Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter '*.msi' -EA SilentlyContinue
          $nsis = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe' -EA SilentlyContinue
          if (-not $msi -or -not $nsis) {
            Write-Error "Missing artifacts: MSI=$($msi.Count) NSIS=$($nsis.Count)"
            exit 1
          }
          Write-Output "MSI: $($msi[0].FullName) ($($msi[0].Length) bytes)"
          Write-Output "NSIS: $($nsis[0].FullName) ($($nsis[0].Length) bytes)"

      - name: Upload to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          name: 'YunZaiConsole v${{ github.ref_name }}'
          body: |
            Tauri 2 desktop console for TRSS Yunzai + NapCat + Redis.

            **Features**: Single-instance + tray + close-to-tray, strict startup order
            (Redis -> Yunzai -> NapCat), keep Redis on close, embedded WebUI iframe,
            real-time log tail, settings panel.

            **Privacy**: No user data uploaded. Default paths use `<USERNAME>` placeholder.

            **Install**: MSI (recommended) or NSIS exe.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show toolchain info
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version
          "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualCpp.Tools.HostX64.TargetX64 -property installationPath

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        run: npm run tauri build

      - name: List artifacts
        if: always()
        run: |
          if (Test-Path src-tauri/target/release/bundle) {
            Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File |
              Where-Object { $_.Extension -in '.msi', '.exe' } |
              Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Error 'No bundle dir found'
            exit 1
          }

      - name: Upload artifacts to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          name: 'YunZaiConsole v${{ github.ref_name }}'
          body: |
            Tauri 2 desktop console for TRSS Yunzai + NapCat + Redis.

            **Features**: Single-instance + tray + close-to-tray, strict startup order
            (Redis -> Yunzai -> NapCat), keep Redis on close, embedded WebUI iframe,
            real-time log tail, settings panel.

            **Privacy**: No user data uploaded. Default paths use `<USERNAME>` placeholder.

            **Install**: MSI (recommended) or NSIS exe.
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
